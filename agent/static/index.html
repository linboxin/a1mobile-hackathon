<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAFIAOS</title>
<style>
  :root { --bg:#07080a; --ink:#c8d2d4; --dim:#4e5a5e; --line:#1d2426;
          --red:#e5484d; --amber:#ffb454; --green:#7ce38b; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); margin:0; min-height:100vh;
         font-family:'SF Mono',ui-monospace,Menlo,monospace; }
  .wrap { max-width:900px; margin:0 auto; padding:2.2rem 1.4rem; }
  header { display:flex; justify-content:space-between; align-items:baseline;
           border-bottom:1px solid var(--line); padding-bottom:1rem; gap:1rem; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.6rem; letter-spacing:.55em; font-weight:600; }
  h1 .os { color:var(--red); }
  h1 .sub { font-size:.9rem; letter-spacing:.3em; color:var(--dim); }
  nav button { background:none; border:1px solid var(--line); color:var(--dim);
               font:inherit; font-size:.72rem; letter-spacing:.15em;
               padding:.35rem .7rem; cursor:pointer; }
  nav button.on { color:var(--ink); border-color:var(--dim); }
  nav button.lang { border-color:var(--amber); color:var(--amber); margin-left:.6rem; }
  .banner { margin:2rem 0 .4rem; font-size:.72rem; color:var(--dim); letter-spacing:.3em; }
  .phase { font-size:1.5rem; letter-spacing:.28em; margin:0 0 1.8rem; color:var(--amber); }
  .lines { display:flex; flex-direction:column; gap:.9rem; }
  .pline { display:grid; grid-template-columns:8rem 1fr auto; gap:1rem;
           align-items:center; border-left:2px solid var(--line); padding:.4rem 0 .4rem 1rem; }
  .pline .nm { font-size:1.05rem; letter-spacing:.12em; }
  .pline.dead { opacity:.45; } .pline.dead .nm { text-decoration:line-through; color:var(--red); }
  .wave { height:14px; }
  .wave svg { width:100%; height:14px; } .wave polyline { fill:none; stroke:var(--line); stroke-width:1.4; }
  .pline.waiting .wave polyline { stroke:var(--amber); animation:pulse 1.4s infinite; }
  .pline.donep .wave polyline { stroke:var(--green); }
  .pline.oncall { border-left-color:var(--red); }
  .pline.oncall .wave polyline { stroke:var(--red); animation:pulse .7s infinite; }
  .pline.oncall .st { color:var(--red); }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .st { font-size:.7rem; letter-spacing:.18em; color:var(--dim); text-align:right; }
  .pline.donep .st { color:var(--green); } .pline.waiting .st { color:var(--amber); }
  .explain { border-left:2px solid var(--amber); padding:.6rem 0 .6rem 1rem; margin:-.6rem 0 1.6rem;
             font-size:.82rem; line-height:1.7; color:var(--ink); }
  .explain .sub { color:var(--dim); font-size:.75rem; }
  .clock { float:right; color:var(--dim); font-size:.72rem; letter-spacing:.15em; }
  .meta { margin:1.6rem 0; font-size:.78rem; color:var(--dim); letter-spacing:.12em; }
  .meta b { color:var(--amber); font-weight:600; }
  .record { margin-top:2rem; border-top:1px dashed var(--line); padding-top:1rem; }
  .record .tt { font-size:.68rem; letter-spacing:.3em; color:var(--dim); margin-bottom:.6rem; }
  .record p { margin:.25rem 0; font-size:.78rem; color:var(--dim); }
  .record p:first-child { color:var(--ink); }
  .narr { border:1px solid var(--line); padding:1rem 1.2rem; margin-top:1.6rem;
          color:var(--amber); font-size:.9rem; line-height:1.6; }
  .post { color:var(--ink); border-color:var(--dim); margin-top:.8rem; }
  input, select { background:#0d0f12; border:1px solid var(--line); color:var(--ink);
                  font:inherit; font-size:.8rem; padding:.45rem .6rem; width:100%; }
  .btn { background:none; border:1px solid var(--red); color:var(--red); font:inherit;
         font-size:.78rem; letter-spacing:.22em; padding:.7rem 1.4rem; cursor:pointer; margin-top:1.4rem; }
  .btn:hover { background:var(--red); color:#000; }
  .btn.small { padding:.35rem .7rem; font-size:.66rem; margin:0; border-color:var(--dim); color:var(--dim); }
  .btn.small:hover { background:var(--dim); color:#000; }
  .grid { display:grid; grid-template-columns:7rem 1fr auto auto; gap:.5rem; align-items:center; margin:.4rem 0; }
  .dot { width:.55rem; height:.55rem; border-radius:50%; background:var(--line); display:inline-block; }
  .dot.ok { background:var(--green); box-shadow:0 0 6px var(--green); }
  .lbl { font-size:.68rem; color:var(--dim); letter-spacing:.2em; margin:1.4rem 0 .4rem; }
  table { width:100%; border-collapse:collapse; font-size:.75rem; margin-top:.6rem; }
  td, th { border-bottom:1px solid var(--line); padding:.45rem .5rem; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:400; letter-spacing:.15em; font-size:.66rem; }
  td.role { color:var(--red); }
  .notes p { font-size:.75rem; color:var(--amber); margin:.3rem 0; }
  .hostrow { display:flex; gap:.8rem; margin-top:1.6rem; }
  .snd { position:fixed; right:1rem; bottom:1rem; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:1.2rem;
           background:#111; border:1px solid var(--dim); padding:.5rem 1rem;
           font-size:.72rem; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MAFIA<span class="os">OS</span> <span class="sub" id="brandsub"></span></h1>
    <nav>
      <button id="tab-public" class="on" onclick="setTab('public')"></button>
      <button id="tab-lobby" onclick="setTab('lobby')"></button>
      <button id="tab-director" onclick="setTab('director')"></button>
      <button class="lang" onclick="toggleLang()" id="langbtn"></button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<button class="btn small snd" id="sndbtn" onclick="toggleSound()"></button>
<div id="toast"></div>

<script>
/* ---------------- localization ---------------- */
const UI = {
  zh: {
    sub:"狼人杀", public:"公屏", lobby:"大厅", director:"上帝", langbtn:"EN",
    soundOn:"声音开", soundOff:"声音关", standby:"待机", hotline:"法官热线",
    voiceLang:"语音", clock:"本阶段已进行",
    phases:{ none:"暂无对局", lobby:"大厅开放", role_calls:"身份分发中",
             actions:"天黑请闭眼", evidence:"情报下发中", accusations:"发言指控",
             vote:"放逐投票", reveal:"天亮了 · 结局揭晓" },
    info:{
      none:["还没有对局。","在『大厅』填入四名玩家并开启房间。"],
      lobby:["房间已开启，等待主持人发令。","先给每位玩家发验证码完成同意，再点『开始游戏』。"],
      role_calls:["法官正在逐个下发秘密身份。","每位玩家回拨热线，听自己的身份，说『明白』后挂断。"],
      actions:["天黑了。狼人、预言家、守卫正在各自秘密行动。","有技能的三人分别回拨热线说出目标；平民今晚无需行动。"],
      evidence:["法官已结算夜晚，正在下发各不相同的私人情报。","每位玩家回拨热线收听只属于自己的那一条——其中一条是狼人的伪造。"],
      accusations:["发言阶段。玩家先当面互相盘问，再单独向法官陈述。","每位玩家回拨热线，说出怀疑谁、为什么。"],
      vote:["投票阶段。法官会先念一段匿名的发言摘要。","每位玩家回拨热线，投出放逐票。"],
      reveal:["本局结束，身份与复盘已揭晓。","可回拨热线听法官宣读最终审判。"]
    },
    stDead:"已出局", stCall:"通话中", stDone:"本阶段已完成", stWait:"等待其回拨", stOnline:"在线",
    accused:"被指", strangers:"陌生来电通话中", received:"本阶段已收到",
    stillWaiting:"仍在等待", allIn:"全部完成，即将进入下一阶段", feed:"实时记录",
    newGame:"新对局", hostToken:"主持人口令", scenario:"剧本", gameLang:"游戏语言",
    players:"四名玩家", name:"名字", phone:"+1 手机号", openRoom:"开启房间",
    consent:"短信验证（玩家同意）", sendCode:"发验证码", code:"验证码",
    verified:"已验证", begin:"天黑请闭眼 · 开始游戏", inProgress:"对局进行中",
    dirTitle:"上帝视角 — 保密", loading:"载入中…", load:"载入",
    thPlayer:"玩家", thRole:"身份", thAction:"夜间行动", thClue:"私人情报", thVote:"投票",
    dirNotes:"导演记录", forceAdv:"强制推进", newRoom:"新对局",
    themes:{ "moonlit-village":"月夜村庄（经典狼人杀）", "signal-station":"信号站",
             "haunted-hotel":"闹鬼旅馆", "spaceship":"深空飞船", "spy-agency":"谍报网络" },
    roles:{ intruder:"狼人", investigator:"预言家", guardian:"守卫", civilian:"平民" },
    t:{ fill:"请填满四名玩家", opened:"房间已开启", began:"游戏开始，天黑请闭眼",
        needTok:"请输入主持人口令", tokFirst:"请先在大厅页输入主持人口令",
        tokEmpty:"口令为空", tokSaved:"口令已保存", sent:"验证码已发给",
        sendFail:"发送失败", ok:"已验证", confFail:"验证失败",
        abandon:"放弃当前对局并开新房间？", noGame:"暂无对局。请在大厅开启新房间。" }
  },
  en: {
    sub:"MAFIA", public:"PUBLIC", lobby:"LOBBY", director:"DIRECTOR", langbtn:"中文",
    soundOn:"SOUND ON", soundOff:"SOUND OFF", standby:"STANDBY", hotline:"HOTLINE",
    voiceLang:"VOICE", clock:"PHASE ELAPSED",
    phases:{ none:"NO ACTIVE GAME", lobby:"LOBBY OPEN", role_calls:"DEALING ROLES",
             actions:"NIGHT FALLS", evidence:"EVIDENCE INBOUND", accusations:"OPEN CHANNEL",
             vote:"THE VOTE IS LIVE", reveal:"DAY BREAKS · VERDICT" },
    info:{
      none:["No game yet.","Open a room in the LOBBY tab with four players."],
      lobby:["Room is open, awaiting the host.","Verify each player by SMS, then press BEGIN."],
      role_calls:["The judge is dealing secret roles one by one.","Each player calls the hotline, hears their role, says understood, hangs up."],
      actions:["Night has fallen. Intruder, Investigator and Guardian are acting in secret.","Those three call the hotline privately; the Civilian has nothing to do tonight."],
      evidence:["Night resolved. Different private evidence is going out to each player.","Everyone calls in to hear only their own — one of them is the Intruder's fabrication."],
      accusations:["Accusations. Players argue face to face, then state their case to the judge alone.","Each player calls the hotline and names a suspect."],
      vote:["The vote. The judge reads an anonymized summary of the accusations first.","Each player calls the hotline to cast an elimination vote."],
      reveal:["The game is over — roles and debrief revealed.","Call the hotline to hear the judge deliver the verdict."]
    },
    stDead:"ELIMINATED", stCall:"ON CALL", stDone:"DONE THIS PHASE", stWait:"AWAITING CALL", stOnline:"CONNECTED",
    accused:"accused", strangers:"Unknown caller on the line", received:"RECEIVED THIS PHASE",
    stillWaiting:"still waiting on", allIn:"all in — advancing", feed:"LIVE RECORD",
    newGame:"NEW GAME", hostToken:"HOST TOKEN", scenario:"SCENARIO", gameLang:"GAME LANGUAGE",
    players:"FOUR PLAYERS", name:"NAME", phone:"+1 PHONE", openRoom:"OPEN THE ROOM",
    consent:"CONSENT CHECK (SMS)", sendCode:"SEND CODE", code:"CODE",
    verified:"VERIFIED", begin:"BEGIN THE GAME", inProgress:"GAME IN PROGRESS",
    dirTitle:"DIRECTOR VIEW — CONFIDENTIAL", loading:"loading…", load:"LOAD",
    thPlayer:"PLAYER", thRole:"ROLE", thAction:"NIGHT ACTION", thClue:"PRIVATE CLUE", thVote:"VOTE",
    dirNotes:"DIRECTOR NOTES", forceAdv:"FORCE ADVANCE", newRoom:"NEW GAME",
    themes:{ "moonlit-village":"MOONLIT VILLAGE (classic)", "signal-station":"SIGNAL STATION",
             "haunted-hotel":"HAUNTED HOTEL", "spaceship":"SPACESHIP", "spy-agency":"SPY AGENCY" },
    roles:{ intruder:"Intruder", investigator:"Investigator", guardian:"Guardian", civilian:"Civilian" },
    t:{ fill:"fill in all four players", opened:"room open", began:"the game has begun",
        needTok:"enter the host token", tokFirst:"enter the host token in the LOBBY tab first",
        tokEmpty:"token is empty", tokSaved:"token saved", sent:"code sent to",
        sendFail:"send failed", ok:"verified", confFail:"confirm failed",
        abandon:"Abandon the current game and open a new room?", noGame:"No game. Open a room in the lobby." }
  }
};
let lang = localStorage.getItem("mafiaos_ui") || "zh";
const L = () => UI[lang];

let audioCtx = null, gainNode = null, soundOn = false;
let tab = "public", S = {phase:"none"}, verified = [], directorS = null;
let token = localStorage.getItem("mafiaos_token") || "";
let lastKey = "";

const $ = (h) => { document.getElementById("view").innerHTML = h; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block";
                   setTimeout(()=>t.style.display="none", 2600); }
function chrome(){
  document.getElementById("brandsub").textContent = L().sub;
  document.getElementById("tab-public").textContent = L().public;
  document.getElementById("tab-lobby").textContent = L().lobby;
  document.getElementById("tab-director").textContent = L().director;
  document.getElementById("langbtn").textContent = L().langbtn;
  document.getElementById("sndbtn").textContent = soundOn ? L().soundOn : L().soundOff;
}
function toggleLang(){
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("mafiaos_ui", lang);
  chrome(); render(true);
}
function setTab(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
                    document.getElementById("tab-"+t).classList.add("on"); render(true); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"content-type":"application/json"},
                                       body: JSON.stringify({token, ...body})} : undefined);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) toast(j.error || ("error "+r.status));
  return j;
}
function needToken(){ if (token) return true; toast(L().t.tokFirst); return false; }
function saveTok(id){
  const t = document.getElementById(id).value.trim();
  if (!t) return toast(L().t.tokEmpty);
  token = t; localStorage.setItem("mafiaos_token", t); toast(L().t.tokSaved); tick();
}

/* ---------------- views ---------------- */
function wave(){ let pts=[]; for(let x=0;x<=100;x+=4) pts.push(x+","+(7+Math.sin(x/6)*4*Math.random()));
  return `<svg preserveAspectRatio="none" viewBox="0 0 100 14"><polyline points="${pts.join(" ")}"/></svg>`; }

function publicView(){
  const s = S, T = L();
  const hot = s.hotline ? ` // ${T.hotline} <b style="color:var(--red)">${esc(s.hotline)}</b>` : "";
  const vl = s.lang ? ` // ${T.voiceLang} ${s.lang === "zh" ? "中文" : "EN"}` : "";
  const head = s.code ? `GAME ${esc(s.code)} // ${esc((T.themes[s.theme]||s.theme||"").toUpperCase())}` : T.standby;
  let clock = "";
  if (s.phase_started && s.now){
    const secs = Math.max(0, Math.round(s.now - s.phase_started));
    clock = `<span class="clock">${T.clock} ${String(Math.floor(secs/60)).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}</span>`;
  }
  const info = T.info[s.phase] || ["",""];
  let h = `<div class="banner">${head}${hot}${vl}${clock}</div>
           <div class="phase">${T.phases[s.phase]||esc(s.phase)}</div>
           <div class="explain">${esc(info[0])}<br><span class="sub">${esc(info[1])}</span></div>`;
  if (s.players){
    const oncall = s.on_call || {};
    h += `<div class="lines">` + s.players.map(p=>{
      const waiting = (s.waiting_on||[]).includes(p.name);
      const done = (s.done_names||[]).includes(p.name);
      const calling = oncall[p.name] !== undefined;
      const cls = !p.alive ? "dead" : calling ? "oncall" : waiting ? "waiting" : done ? "donep" : "";
      let st;
      if (!p.alive) st = T.stDead;
      else if (calling) st = `${T.stCall} ${oncall[p.name]}s`;
      else if (done) st = T.stDone;
      else if (waiting) st = T.stWait;
      else st = T.stOnline;
      const n = (s.suspicion&&s.suspicion[p.name])||0;
      return `<div class="pline ${cls}"><span class="nm">${esc(p.name)}</span>
              <span class="wave">${wave()}</span>
              <span class="st">${n? T.accused+" "+"█".repeat(n)+" · ":""}${st}</span></div>`;
    }).join("") + `</div>`;
    const strangers = Object.keys(oncall).filter(n => !s.players.some(p=>p.name===n));
    if (strangers.length) h += `<div class="meta">${T.strangers}: ${strangers.map(esc).join(", ")}</div>`;
    if (s.received) h += `<div class="meta">${T.received}: <b>${esc(s.received)}</b>` +
      ((s.waiting_on||[]).length ? ` · ${T.stillWaiting} <b>${s.waiting_on.map(esc).join(", ")}</b>` : ` · ${T.allIn}`) + `</div>`;
    if (s.narration) h += `<div class="narr">${esc(s.narration)}</div>`;
    if (s.postgame) h += `<div class="narr post">${esc(s.postgame)}</div>`;
  }
  const log = (s.log||[]);
  h += `<div class="record"><div class="tt">${T.feed}</div>` +
       (log.length ? log.slice().reverse().map(l=>`<p>${esc(l)}</p>`).join("")
                   : `<p>${esc(T.t.noGame)}</p>`) + `</div>`;
  $(h);
}

let phones = {};
function phoneOf(n){ return phones[n]; }

function lobbyView(){
  const T = L();
  if (S.phase === "none"){
    let rows = "";
    for (let i=0;i<4;i++)
      rows += `<div class="grid"><input id="n${i}" placeholder="${T.name}">
               <input id="p${i}" placeholder="${T.phone}"><span></span><span></span></div>`;
    const themeOpts = Object.entries(T.themes)
      .map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
    $(`<div id="createform"><div class="banner">${T.newGame}${S.hotline? ` // ${T.hotline} <b style="color:var(--red)">${esc(S.hotline)}</b>`:""}</div>
       <div class="lbl">${T.hostToken}</div>
       <input id="tok" placeholder="token" value="${esc(token)}" style="max-width:14rem">
       <div class="lbl">${T.gameLang}</div>
       <select id="glang">
         <option value="zh"${lang==="zh"?" selected":""}>中文（法官说中文）</option>
         <option value="en"${lang==="en"?" selected":""}>English (judge speaks English)</option>
       </select>
       <div class="lbl">${T.scenario}</div>
       <select id="theme">${themeOpts}</select>
       <div class="lbl">${T.players}</div>${rows}
       <button class="btn" onclick="createGame()">${T.openRoom}</button></div>`);
    return;
  }
  const rows = (S.players||[]).map(p=>{
    const ph = phoneOf(p.name)||"";
    const ok = verified.some(v => v.slice(-10) === ph.slice(-10));
    return `<div class="grid"><span>${esc(p.name)}</span>
       <span style="color:var(--dim);font-size:.72rem">${esc(ph)}</span>
       <span class="dot ${ok?"ok":""}"></span>
       <span>${ok? `<span style="color:var(--green);font-size:.66rem">${T.verified}</span>`
                 : `<button class="btn small" onclick="sendOtp('${esc(p.name)}')">${T.sendCode}</button>
                    <input id="code-${esc(p.name)}" placeholder="${T.code}" style="width:5.5rem">
                    <button class="btn small" onclick="confirmOtp('${esc(p.name)}')">OK</button>`}</span>
     </div>`; }).join("");
  $(`<div class="banner">GAME ${esc(S.code)} // ${T.lobby}</div>
     <div class="lbl">${T.consent}</div>${rows}
     ${S.phase==="lobby" ? `<button class="btn" onclick="startGame()">${T.begin}</button>`
                          : `<div class="meta">${T.inProgress}</div>`}`);
}

function directorView(){
  const T = L();
  if (!token){ $(`<div class="banner">${T.dirTitle}</div>
      <div class="lbl">${T.hostToken}</div>
      <div style="display:flex;gap:.6rem;max-width:20rem">
        <input id="dtok" placeholder="token">
        <button class="btn small" onclick="saveTok('dtok')">${T.load}</button>
      </div>`); return; }
  if (!directorS || directorS.error){ $(`<div class="banner">${T.dirTitle}</div>
      <div class="meta">${T.loading}</div>`); return; }
  const d = directorS;
  const rows = (d.players_full||[]).map(p=>{
    phones[p.name] = p.phone;
    const action = Object.entries(d.actions||{}).find(([r])=>r===p.role);
    return `<tr><td>${esc(p.name)}</td><td class="role">${esc(T.roles[p.role]||p.role||"—")}</td>
      <td>${esc(action? action[1] : "—")}</td>
      <td>${esc((d.clues||{})[p.name]||"—")}</td>
      <td>${esc((d.votes||{})[p.name]||"—")}</td></tr>`; }).join("");
  $(`<div class="banner">${T.dirTitle}</div>
     <table><tr><th>${T.thPlayer}</th><th>${T.thRole}</th><th>${T.thAction}</th><th>${T.thClue}</th><th>${T.thVote}</th></tr>${rows}</table>
     <div class="lbl">${T.dirNotes}</div>
     <div class="notes">${(d.director_notes||[]).map(n=>`<p>${esc(n)}</p>`).join("")||"<p>—</p>"}</div>
     <div class="hostrow">
       <button class="btn small" onclick="advance()">${T.forceAdv}</button>
       <button class="btn small" onclick="newGame()">${T.newRoom}</button>
     </div>`);
}

function render(force=false){
  const view = document.getElementById("view");
  const active = document.activeElement;
  if (!force && active && view.contains(active) &&
      ["INPUT","SELECT","TEXTAREA"].includes(active.tagName)) return;
  if (!force && tab==="lobby" && S.phase==="none" && document.getElementById("createform")) return;
  if (tab!=="public"){
    const key = tab + lang + JSON.stringify([S, verified, directorS]);
    if (!force && key===lastKey) return;
    lastKey = key;
  }
  if (tab==="public") publicView();
  else if (tab==="lobby") lobbyView();
  else directorView();
}

/* ---------------- actions ---------------- */
async function createGame(){
  const t = document.getElementById("tok").value.trim();
  if (!t) return toast(L().t.needTok);
  token = t; localStorage.setItem("mafiaos_token", t);
  const players = [];
  for (let i=0;i<4;i++){
    const name = document.getElementById("n"+i).value.trim();
    const phone = document.getElementById("p"+i).value.trim();
    if (!name || !phone) return toast(L().t.fill);
    players.push({name, phone}); phones[name]=phone;
  }
  const theme = document.getElementById("theme").value;
  const glang = document.getElementById("glang").value;
  const r = await api("/api/game", {players, theme, lang: glang});
  if (r.code) { toast(L().t.opened+" "+r.code); await tick(); }
}
async function startGame(){ if(!needToken())return;
  const r = await api("/api/game/start", {}); if (r.phase) { toast(L().t.began); setTab("public"); } }
async function advance(){ if(!needToken())return; await api("/api/game/advance", {}); tick(); }
async function newGame(){ if(!needToken())return;
  if (confirm(L().t.abandon)) { S={phase:"none"}; setTab("lobby"); } }
async function sendOtp(name){ if(!needToken())return;
  const r = await api("/api/players/verify", {phone: phoneOf(name)});
  toast(r.status<400 ? L().t.sent+" "+name : L().t.sendFail); }
async function confirmOtp(name){ if(!needToken())return;
  const code = document.getElementById("code-"+name).value.trim();
  const r = await api("/api/players/confirm", {phone: phoneOf(name), code});
  toast(r.status<400 ? name+" "+L().t.ok : L().t.confFail); refreshVerified(); }

/* ---------------- polling ---------------- */
async function tick(){
  try { S = await (await fetch("/api/state")).json(); } catch(e){}
  if ((tab==="director" || tab==="lobby") && token){
    try { directorS = await (await fetch("/api/director-state?token="+encodeURIComponent(token))).json();
          (directorS.players_full||[]).forEach(p => phones[p.name]=p.phone); } catch(e){}
  }
  render(); nightAudio();
}
async function refreshVerified(){
  try { verified = (await (await fetch("/api/verified")).json()).verified_numbers
        .map(v => typeof v === "string" ? v : (v.phone||"")); } catch(e){ verified=[]; }
}
chrome();
setInterval(tick, 2000); setInterval(refreshVerified, 6000); tick(); refreshVerified();

/* ---------------- night ambience ---------------- */
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("sndbtn").textContent = soundOn ? L().soundOn : L().soundOff;
  if (soundOn && !audioCtx){
    audioCtx = new AudioContext();
    const len = audioCtx.sampleRate * 2, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0); let last=0;
    for (let i=0;i<len;i++){ const w=Math.random()*2-1; d[i]=(last+0.02*w)/1.02; last=d[i]; d[i]*=3.5; }
    const src = audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
    const filter = audioCtx.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=420;
    gainNode = audioCtx.createGain(); gainNode.gain.value=0;
    src.connect(filter).connect(gainNode).connect(audioCtx.destination); src.start();
  }
  nightAudio();
}
function nightAudio(){
  if (!gainNode) return;
  const target = (soundOn && S.phase==="actions") ? 0.05 : 0.0;
  gainNode.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 1.2);
}
